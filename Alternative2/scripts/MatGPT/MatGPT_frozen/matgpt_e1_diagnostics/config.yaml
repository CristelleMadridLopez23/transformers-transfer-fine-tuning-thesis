experiment: matgpt_e1_1_e1_2_frozen_diagnostics
dataset:
  path: Alternative2/reports/matgpt_e1_v2/dataset.csv
  historical_split_manifest: Alternative2/reports/matgpt_e1_v2/split_manifest.json
  target_column: energy_dft_ev_atom
  target_definition: energía DFT-GGA estática dividida entre número de átomos (eV/átomo), no energía de formación
  accepted_structures: 234
  compositions: 78
  split_counts:
    train: {structures: 186, compositions: 62}
    val: {structures: 24, compositions: 8}
    test: {structures: 24, compositions: 8}
backbone:
  checkpoint: Alternative2/models/MatGPT-source/mat-concat/mat-uncond/weights/transformer_property_0.pth
  sha256: 4318e5fa88a5b177606c792c518251588edf446fa5edb13c35faa08e34d0e414
  official_source_commit: a2eaee254bc829f0cc19edce5cbf27bbc3d35d5e
  frozen: true
  layers_unfrozen: 0
embeddings:
  last_token_cache: Alternative2/data/embeddings/matgpt_e1_v2/matgpt_uncond_last_token.npz
  masked_mean_cache: Alternative2/data/embeddings/matgpt_e1_2_masked_mean_v1/matgpt_uncond_masked_mean.npz
  dimension: 768
  hidden_state_location: after ln_f, before lm_head
  masked_mean_excludes: [<start>, <end>, <pad>]
e1_1:
  pooling: last_token
  ridge_alpha: [0.1, 1, 10, 100]
  mlp_hidden_units: [8, 32]
  dropout: 0.1
  pairwise_lambda: [0.0, 0.1, 0.3, 1.0]
  pairwise_formula_normalization: RMS of within-composition DFT pair differences in train only; floor 0.001 eV/atom
  absolute_target_normalization: standard deviation of train target only
e1_2:
  controls:
    - {pooling: last_token, head: mlp32, pairwise_lambda: 0.0}
    - {pooling: masked_mean, head: mlp32, pairwise_lambda: 0.0}
  selection_rule: Choose and justify a candidate using only train and validation; do not choose a scalar weighted score after seeing metrics.
training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 200
  early_stopping_patience: 20
  batch_sampler: all available polymorphs grouped by composition
  compositions_per_batch: 8
  seeds: [42, 123, 2026]
  backbone_parameters_trainable: 0
evaluation:
  test_access: only after validation selection is recorded in final_test_selection.csv
  pairwise_dft_tie_tolerance_ev_atom: 0.001
  previous_test_exposure: Test labels were previously inspected during E1; final evaluation is descriptive and is not a fresh blind test.
  output_units: eV/atom and meV/atom
outputs:
  reports_root: Alternative2/reports
  figures_format: PNG
  pdf_or_archives: false
scientific_limitations:
  - Exact DFT exchange-correlation functional and pseudopotential are not recorded in the local provenance files.
  - The labels are static GGA total energies per atom and are not formation energies.
  - E1's test outcomes were previously inspected; do not use them for selecting new configurations.
  - These diagnostics do not fine-tune MatGPT and do not execute E2.
