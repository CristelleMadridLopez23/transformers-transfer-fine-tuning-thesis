experiment: H3_matgpt_frozen_ridge_mean_mlp8_residual
run_id: hybrid_ridge_mlp8_v1
data:
  dataset: Alternative2/reports/MatGPT_frozen/matgpt_e1_v2/dataset.csv
  folds: Alternative2/reports/MatGPT_frozen_2/v1/fold_assignments.csv
  features: Alternative2/reports/MatGPT_frozen_3/run_20261023_v2/features_cache/layer_features.npz
  checkpoint: Alternative2/models/MatGPT-source/mat-concat/mat-uncond/weights/transformer_property_0.pth
  checkpoint_sha256: 4318e5fa88a5b177606c792c518251588edf446fa5edb13c35faa08e34d0e414
  source_commit: a2eaee254bc829f0cc19edce5cbf27bbc3d35d5e
development_only: {structures: 210, compositions: 70}
historical_test: excluded_before_target_parsing: true
outer_folds: 5
seeds: [42, 123, 2026]
ridge:
  alphas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  solver: lsqr
  tolerance: 1.0e-8
  scaler: StandardScaler
  inner_selection: minimum_inner_validation_composition_MAE
  refit_after_selection: full_outer_training_compositions
mlp8_residual:
  architecture: [768, 8, 1]
  activation: GELU
  dropout: 0.1
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  beta: 1.0
  max_epochs: 200
  patience: 20
  compositions_per_batch: 8
  scale: inner_train_residual_standard_deviation
  checkpoint_selection: minimum_inner_validation_normalized_SmoothL1
metrics: {pair_tolerance_mev_atom: 1.0, gs_gap_exclusion_mev_atom: 1.0, bootstrap_replicates: 2000, bootstrap_seed: 13072026}
figures: PNG
limits:
  - MatGPT remains frozen; no geometric descriptors or explicit formula features enter the predictor.
  - Historical validation was previously used to select candidates; results are exploratory.
  - R4 deterministic predictions are fold-level and are combined with each H2 seed only for H3-A recombination.
