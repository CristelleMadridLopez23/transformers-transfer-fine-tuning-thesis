experiment: matgpt_e1_3
candidates:
  matgpt_e13_mlp8_mean_pair1:
    pooling: masked_mean
    head: mlp8
    width: 8
    pairwise_lambda: 1.0
    hypothesis: Selección del estado fundamental
  matgpt_e13_mlp8_last_pair1:
    pooling: last_token
    head: mlp8
    width: 8
    pairwise_lambda: 1.0
    hypothesis: Diferencias de energía relativa
  matgpt_e13_mlp32_mean_abs:
    pooling: masked_mean
    head: mlp32
    width: 32
    pairwise_lambda: 0.0
    hypothesis: Energía absoluta
seeds:
- 42
- 123
- 2026
outer_cv:
  method: GroupKFold
  n_splits: 5
  groups: canonical full chemical composition
  development: historical train + val
  development_structures: 210
  development_compositions: 70
  historical_test_excluded_structures: 24
  historical_test_excluded_compositions: 8
inner_validation:
  method: deterministic seeded group holdout
  fraction: 0.2
  seed_base: 13072026
  fold_seed: seed_base + zero-based outer fold
  purpose: early stopping only
training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 200
  patience: 20
  compositions_per_batch: 8
  absolute_loss: smooth_l1_loss(beta=1.0) of normalized residual
  target_scale: std and mean of inner-train targets only; std floor 1e-6
  pairwise_loss: per-composition mean smooth_l1_loss(beta=1.0) of within-group pair
    residuals normalized by inner-train RMS pair difference; floor 0.001 eV/atom
  checkpoint_selection: lowest inner-validation objective; no outer fold used for
    selection
  backbone_trainable_parameters: 0
metrics:
  energy: eV/atom
  relative_energy: meV/atom
  tie_tolerance_ev_atom: 0.001
  bootstrap_replicates: 2000
  bootstrap_seed: 13072026
limits:
- E1 historical test is excluded entirely from E1.3.
- E1.1/E1.2 candidates were selected using the same eight historical validation compositions;
  E1.3 estimates sensitivity/robustness and does not remove selection bias.
- E1 historical test was previously inspected and is not blind.
- E1.2 geometry diagnostics included all 234 structures; their test-containing correlations
  are exploratory and did not select E1.3 folds.
- DFT labels are static GGA total energies per atom, not formation energies.
