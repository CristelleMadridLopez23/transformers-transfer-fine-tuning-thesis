experiment_id: exp01_mattext_frozen
seed: 42
logging_level: INFO
error_policy: stop
paths:
  source: data/results(1).json
  slices: data/toSLICES_output/20261019T213302_981691Z/abs3_slices_valid.csv
  slices_summary: data/toSLICES_output/20261019T213302_981691Z/summary.json
  notebook: data/toSLICES.ipynb
  checkpoint: model-pretrained/mattext-slices-2m
  checkpoint_manifest: model-pretrained/mattext-manifest.json
  processed: data/processed/exp01_mattext_frozen
  embeddings: data/embeddings/exp01_mattext_frozen
  experiment: experiments/exp01_mattext_frozen
  reports: reports/exp01_mattext_frozen
tokenizer:
  vocab: reports/exp01_mattext_frozen/audit/reference/candidate_vocab.json
  evidence: reports/exp01_mattext_frozen/audit/reference/checkpoint_tokenizer_evidence.json
  # Must link a published tokenizer artifact to this exact checkpoint revision.
  # The audit never treats a manually set boolean as proof of ID compatibility.
  max_length: 512
  truncation_policy: reject
  special_tokens_order: ["[UNK]", "[PAD]", "[CLS]", "[SEP]", "[MASK]", "[EOS]", "[BOS]"]
data:
  geometry_tolerance_angstrom: 0.00001
  minimum_compositions: 10
  minimum_polymorphs: 2
  require_three_families: true
split:
  test_fraction: 0.2
  folds: 4
extraction:
  pooling: mean_pooling
  poolings: [mean_pooling, cls_pooling]
  batch_size: 8
  device: cuda
  cpu_threads: 2
  determinism_atol: 0.000001
  mean_excludes: [padding, CLS, SEP, BOS, EOS]
models:
  enabled: [ridge, random_forest, mlp]
  ridge:
    alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
  random_forest:
    n_estimators: [100, 300]
    max_depth: [4, null]
    min_samples_leaf: [1, 3]
    max_features: [0.5, 1.0]
    n_jobs: 8
  mlp:
    hidden_dim: 32
    dropout: 0.1
    learning_rate: [0.001, 0.0003]
    weight_decay: [0.001, 0.01]
    max_epochs: 500
    patience: 40
    batch_size: 32
    inner_validation_fraction: 0.2
evaluation:
  degeneracy_tolerance_ev_atom: 0.001
  primary_selection_metric: development_cv_mae_ev_atom
slurm:
  account: cbartel
  extraction_partition: msigpu
  training_partition: msismall
  python: /users/0/cmadridl/.conda/envs/dmc/bin/python
  # Discovered from the existing environment and sacctmgr, not invented.
