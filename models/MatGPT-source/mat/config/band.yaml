# Single-property generation: band gap (Table 3, Fig. 5c, Fig. 8)
# Run any script with this file:  python <script>.py --config-name band
# Order: train.py -> sample_property.py -> sli_to_cif.py -> band_proxy.py -> metrics.py

data_path:
  fname: "./dataset/Training_dataset_alex20_with_encoding.csv"

model:
  n_embd: 768
  n_head: 12
  n_layer: 12
  dropout: 0.1

training:
  experiment_name: "band"
  learning_rate: 3e-4
  warmup_steps: 500
  batch_size: 16
  max_epochs: 50
  seed: null                       # the paper's runs were not seeded; set an integer for repeatable new runs
  selected_properties: ["band_gap_ind"]   # column in the training CSV (eV)
  num_properties: 1
  special_tokens: ["<band>"]
  slices: "SLICES"                 # SLICES column in the training CSV

paths:
  out_root: "./outputs/${training.experiment_name}"
  log_dir: "${paths.out_root}/logs"
  checkpoint_dir: "${paths.out_root}/checkpoints"
  checkpoint_path: "${paths.out_root}/weights/transformer_property_${training.num_properties}.pth"
  vocab_and_model: "${paths.out_root}/weights/model_info_property_${training.num_properties}.json"
  resume_from_checkpoint: ""       # path to a Lightning .ckpt to resume training

sample:
  checkpoint_path: ${paths.checkpoint_path}
  vocab_and_model: ${paths.vocab_and_model}
  properties: [1.5, 2.0, 3.0, 4.0]   # eV
  initial_tokens: []
  max_new_tokens: 2000
  number_sequences: 500            # samples per target
  max_attempts: 10                 # attempts per sample until the SLICES check and reconstruction pass
  timeout: 300                     # seconds per sample (checked between attempts)
  temperature: 1.2
  top_p: 0.9
  seed: null                       # the paper's runs were not seeded
  save_path: "${paths.out_root}/sample/generated_with_property_${training.num_properties}.csv"

back_to_cif:
  output_folder: "${paths.out_root}/sample/output_structures"
  file_path: ${sample.save_path}
  reconstructed: "reconstructed_sequences_with_properties_${training.num_properties}.csv"
  plot_name: "conversion_counts_plot_${training.num_properties}.png"

proxy_model:
  model_bulk_modulus: "logK_MP_2019"
  model_eform: "MEGNet-MP-2018.6.1-Eform"
  model_band: "MEGNet-MP-2019.4.1-BandGap-mfi"
  csv_path: "${back_to_cif.output_folder}/${back_to_cif.reconstructed}"
  training_cifs: ${data_path.fname}             # novelty is checked against the training set itself
  training_cif_column: "CIF"                    # column with the CIF text
  show_count: True
  plot_path: "${back_to_cif.output_folder}"

metrics:
  prediction_column: "Predicted_PBE"
  novelty_relative_to: "reconstructed"   # Table 3: as stated in the table caption
  hit_tolerance: 0.5                     # eV, band gap tolerance used in ESI Section S9
  output_csv: "${paths.out_root}/metrics.csv"

hydra:
  run:
    dir: .
